<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение регистрации в Chess Roulette</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #050b14; color: #ffffff; -webkit-font-smoothing: antialiased;">
    
    <div style="width: 100%; background-color: #050b14; background: linear-gradient(135deg, #050b14 0%, #0a1a24 50%, #050b14 100%); padding: 60px 10px; box-sizing: border-box;">
        
        <div style="background-color: #151e27; background-color: rgba(21, 30, 39, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); margin: 0 auto; width: 100%; max-width: 460px; border-radius: 24px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.15);">
            
            <div style="padding: 32px 32px 0 32px;">
                <span style="background: linear-gradient(135deg, #21ce70 0%, #0e8a47 100%); background-color: #21ce70; color: #050b14; border-radius: 12px; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; margin-right: 12px; vertical-align: middle; box-shadow: 0 4px 12px rgba(33, 206, 112, 0.3), inset 0 2px 2px rgba(255,255,255,0.4); text-shadow: 0 1px 0 rgba(255,255,255,0.3); text-align: center; line-height: 36px;">♞</span>
                <span style="color: #ffffff; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; vertical-align: middle; display: inline-block; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Chess Roulette</span>
            </div>
            
            <div style="padding: 24px 32px 32px 32px; text-align: left;">
                <h1 style="font-size: 28px; margin: 0 0 12px 0; font-weight: 700; color: #ffffff; letter-spacing: -0.5px; text-shadow: 0 2px 8px rgba(0,0,0,0.4);">Завершение регистрации</h1>
                <p style="font-size: 15px; line-height: 1.6; color: #a1b0c7; margin: 0 0 32px 0;">Введите этот код на странице регистрации, чтобы подтвердить email и создать аккаунт.</p>
                
                <div style="margin-bottom: 24px;">
                    <span style="font-size: 11px; text-transform: uppercase; color: #21ce70; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; display: block; opacity: 0.9; text-shadow: 0 0 8px rgba(33, 206, 112, 0.2);">Код подтверждения</span>
                    
                    <div style="background-color: #0b1c14; background: rgba(33, 206, 112, 0.05); border: 1px solid rgba(33, 206, 112, 0.2); border-radius: 16px; padding: 20px; text-align: center; box-shadow: inset 0 0 24px rgba(33, 206, 112, 0.05);">
                        <div style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 36px; font-weight: 700; letter-spacing: 16px; color: #21ce70; margin: 0; padding-left: 16px; text-shadow: 0 0 16px rgba(33, 206, 112, 0.4);">{{ code }}</div>
                    </div>
                </div>
            </div>
            
            <hr style="height: 1px; background-color: #232d38; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent); margin: 0 32px 24px 32px; border: none;">
            
            <div style="padding: 0 32px 32px 32px; text-align: left;">
                <p style="font-size: 13px; color: #5a6e85; margin: 0; line-height: 1.5;">Код действует {{ expires_minutes }} минут. Если вы не регистрировались в Chess Roulette, просто проигнорируйте это письмо.</p>
            </div>
            
        </div>
    </div>
</body>
</html>
